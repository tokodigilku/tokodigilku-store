<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Digital</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
}

header{
background:#2563eb;
color:white;
padding:30px;
text-align:center;
}

.banner{
padding:20px;
text-align:center;
}

.produk-container{
padding:15px;
}

.produk{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.harga{
font-size:20px;
font-weight:bold;
color:#2563eb;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

footer{
text-align:center;
padding:20px;
color:#666;
}
</style>
</head>

<body>

<header>
<h1>Store Digital</h1>
<p>Produk Digital Premium</p>
</header>

<div class="banner">
<h2>Selamat Datang</h2>
<p>Temukan produk digital berkualitas dengan harga terjangkau.</p>
</div>

<div class="produk-container">

<div class="produk">
<h3>Resep 1</h3>
<p>File Digital</p>
<p class="harga">Rp5.000</p>
<button>Beli Sekarang</button>
</div>

</div>

<footer>
© 2026 Store Digital
</footer>

</body>
</html>
